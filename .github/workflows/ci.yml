name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # Hydra 1.3 CLI is incompatible with Python 3.14 argparse.
      - run: uv sync --python 3.12 --extra dev
      - run: uv run ruff check .
      - run: uv run pytest
