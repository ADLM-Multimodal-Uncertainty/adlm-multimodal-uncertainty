epochs: 10
batch_size: 32
weighted_loss: false    # inverse-frequency class weights
monitor: val_macro_f1   # val_accuracy | val_balanced_accuracy | val_macro_f1
track_train_metrics: true   # score the training set in eval mode each epoch (one extra pass)

optimizer:               # receives the trainable parameters from src.train
  _target_: torch.optim.AdamW
  lr: 1.0e-3

loss:
  _target_: torch.nn.CrossEntropyLoss
