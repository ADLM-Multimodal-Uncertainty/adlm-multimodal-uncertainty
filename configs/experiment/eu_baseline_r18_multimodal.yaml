# @package _global_
defaults:
  - deep_ensemble
  - override /split: patient_kfold
  - override /model/image_encoder: resnet18

name: eu_baseline_r18_multimodal
split:
  n_folds: 5
model:
  image_encoder:
    freeze: false
train:
  optimizer:
    lr: 1.0e-4
hydra:
  sweeper:
    params:
      fold: range(0,${split.n_folds})
