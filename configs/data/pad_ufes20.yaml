root: data/pad_ufes_20
metadata_csv: ${data.root}/metadata.csv
image_dir: ${data.root}/images     # searched recursively (flat or imgs_part_*/)

image_size: 224
augmentation: flip      # none | flip | derm (applied to training partition only)
subset: null            # int: keep only the first N rows of each partition (smoke runs)
train_fraction: 1.0     # patient-level nested control: 0.25, 0.5, or 1.0
train_subset_seed: 42
permute_metadata: false # negative control: shuffle metadata rows within each split
permute_metadata_seed: 42
num_workers: 0

# biopsed (how the label was verified) and the ID columns would leak the label; never list them.
numeric_features: [age, diameter_1, diameter_2]
categorical_features:
  - smoke
  - drink
  - background_father
  - background_mother
  - pesticide
  - gender
  - skin_cancer_history
  - cancer_history
  - has_piped_water
  - has_sewage_system
  - fitspatrick
  - region
  - itch
  - grew
  - hurt
  - changed
  - bleed
  - elevation
