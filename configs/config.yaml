defaults:
  - data: pad_ufes20
  - split: patient_kfold
  - model: multimodal
  - train: baseline
  - ensemble: deep
  - _self_
  - experiment: null    # not `optional`: a misspelled experiment name must fail, not run defaults

seed: 42
fold: 0                 # used by k-fold splits only
device: auto            # auto (cuda > mps > cpu) | cpu | cuda | mps

# Experiment files set a readable name. A multirun that changes hyperparameters gets a
# sweep_tag suffix so those jobs do not overwrite one directory. Pass tag=... to choose it.
name: ${hydra:runtime.choices.model/image_encoder}-${hydra:runtime.choices.model/tabular_encoder}-${hydra:runtime.choices.model/fusion}
tag: ${sweep_tag:}
run_group: ${name}${tag}
run_name: ${run_group}/fold_${fold}
output_root: outputs
run_dir: ${output_root}/runs/${run_name}

hydra:
  run:
    dir: ${run_dir}
  sweep:
    dir: ${output_root}/runs
    subdir: ${run_name}
  job:
    chdir: false
